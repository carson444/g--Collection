<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administration – G Collection</title><meta name="robots" content="noindex">
<link rel="icon" href="logo.svg"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.box{max-width:460px;margin:80px auto;background:#fff;border:1px solid var(--line);padding:32px}
input,select,textarea{width:100%;padding:13px;border:1px solid var(--line);font:inherit;margin:6px 0 16px;background:#fff;border-radius:0}.box{box-shadow:0 20px 60px #0001}
label{font-weight:500;font-size:.9rem}#panel{display:none}
.item{display:grid;grid-template-columns:60px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.item img{width:60px;height:75px;object-fit:cover;background:var(--line)}
.msg{color:var(--red);min-height:1.4em;margin-top:10px}
body{background:var(--lav)}.box{border-radius:24px}input,select,textarea{border-radius:12px!important}@media(max-width:800px){#panel .wrap{grid-template-columns:1fr!important;gap:32px!important}.item{grid-template-columns:52px 1fr}.item>div:last-child{grid-column:1/-1}.item img{width:52px;height:66px}.box{margin:40px 16px;padding:24px}}</style></head><body>
<header><div class="wrap"><a class="brand" href="/"><img src="logo.svg" alt=""><span><b>G COLLECTION</b><i>ADMINISTRATION</i></span></a><nav><a href="/">Voir le site</a></nav></div></header>

<div class="box" id="login">
  <img src="logo.svg" alt="" style="width:64px;margin-bottom:16px"><h2>Accès privé</h2><p style="color:var(--mute);margin:6px 0 20px">Saisissez votre code d'accès.</p>
  <label for="code">Code d'accès</label><input id="code" type="password" autocomplete="current-password">
  <button class="btn" id="go" style="width:100%">Se connecter</button><div class="msg" id="err"></div>
</div>

<div id="panel"><section><div class="wrap" style="display:grid;grid-template-columns:380px 1fr;gap:48px;align-items:start">
  <form id="f"><h2 style="margin-bottom:20px">Ajouter un pagne</h2>
    <label>Nom</label><input id="name" required>
    <label>Prix (FCFA)</label><input id="price" type="number" min="0" required>
    <label>Catégorie</label><input id="category" placeholder="Ex : Wax premium, Super wax, Pagne cérémonie">
    <label>Description</label><textarea id="description" rows="3"></textarea>
    <label>Photo</label><input id="file" type="file" accept="image/*" required>
    <button class="btn" id="save">Publier</button><div class="msg" id="fm"></div>
  </form>
  <div><h2 style="margin-bottom:12px">Produits en ligne</h2><div id="list"></div></div>
</div></section></div>

<script>
const $=s=>document.querySelector(s);let code="";
const H=()=>({"Content-Type":"application/json","x-admin-code":code});
async function login(){
  let r;try{r=await fetch("/api/sign",{headers:H()})}catch{$("#err").textContent="Connexion impossible. Vérifiez votre internet.";return}
  if(!r.ok){let m="";try{m=(await r.json()).error}catch{}
    $("#err").textContent=r.status===404?"Le serveur de l'admin n'est pas actif. Ouvrez le site depuis son adresse Vercel (https://…vercel.app/admin.html), pas depuis un fichier de votre ordinateur.":(m||"Erreur "+r.status);return}
  $("#login").style.display="none";$("#panel").style.display="block";list();
}
$("#go").onclick=()=>{code=$("#code").value.trim();login()};
$("#code").onkeydown=e=>{if(e.key==="Enter")$("#go").click()};

async function list(){
  const ps=await(await fetch("/api/products")).json();
  $("#list").innerHTML=ps.length?ps.map(p=>`<div class="item"><img src="${p.image}" alt="">
   <div><b>${p.name}</b><div>${Number(p.price).toLocaleString("fr-FR")} FCFA · ${p.category||"Sans catégorie"}</div></div>
   <div><button class="btn sm" onclick="stock(${p.id},${p.in_stock?0:1})">${p.in_stock?"Marquer épuisé":"Remettre en stock"}</button>
   <button class="btn sm" style="background:var(--red);color:#fff" onclick="del(${p.id})">Supprimer</button></div></div>`).join(""):"<p>Aucun produit pour le moment.</p>";
}
async function stock(id,v){await fetch("/api/products",{method:"PATCH",headers:H(),body:JSON.stringify({id,in_stock:v})});list()}
async function del(id){if(confirm("Supprimer ce produit ?")){await fetch("/api/products?id="+id,{method:"DELETE",headers:H()});list()}}
$("#f").onsubmit=async e=>{
  e.preventDefault();$("#save").disabled=true;$("#fm").textContent="Envoi de la photo…";
  try{
    const s=await(await fetch("/api/sign",{headers:H()})).json();
    const fd=new FormData();fd.append("file",$("#file").files[0]);fd.append("api_key",s.apiKey);
    fd.append("timestamp",s.timestamp);fd.append("signature",s.signature);fd.append("folder",s.folder);
    const up=await(await fetch(`https://api.cloudinary.com/v1_1/${s.cloudName}/image/upload`,{method:"POST",body:fd})).json();
    if(!up.secure_url)throw new Error(up.error?.message||"Échec de l'envoi de la photo");
    const r=await fetch("/api/products",{method:"POST",headers:H(),body:JSON.stringify({name:$("#name").value,price:$("#price").value,category:$("#category").value,description:$("#description").value,image:up.secure_url})});
    if(!r.ok)throw new Error((await r.json()).error);
    e.target.reset();$("#fm").style.color="green";$("#fm").textContent="Pagne publié.";list();
  }catch(err){$("#fm").style.color="";$("#fm").textContent=err.message}
  $("#save").disabled=false;
};
</script></body></html>
